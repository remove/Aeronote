server {
    listen 80;
    listen [::]:80;

    server_name aeronote.net www.aeronote.net;

    return 301 https://aeronote.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.aeronote.net;

    ssl_certificate     /etc/nginx/ssl/aeronote.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aeronote.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://aeronote.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name aeronote.net;

    ssl_certificate     /etc/nginx/ssl/aeronote.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/aeronote.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:AeronoteSSL:10m;
    ssl_session_timeout 10m;

    root  /srv/aeronote/current;
    index index.html;

    access_log /var/log/nginx/aeronote.net.access.log;
    error_log  /var/log/nginx/aeronote.net.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
