name: Deploy Aeronote to HK VPS

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeronote-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy to Hong Kong
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Validate Quartz configuration
        run: |
          test -s quartz.config.yaml
          test -s quartz.lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Package release
        id: package
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          archive="aeronote-${RELEASE_ID}.tar.gz"
          tar -C public -czf "$archive" .
          sha256sum "$archive" > "$archive.sha256"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload portable release artifact
        uses: actions/upload-artifact@v7
        with:
          name: aeronote-${{ steps.package.outputs.release_id }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          scp -o BatchMode=yes "$ARCHIVE" "$ARCHIVE.sha256" \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/aeronote/shared/"

      - name: Activate release atomically
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ steps.package.outputs.release_id }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$RELEASE_ID'" < ops/activate-release.sh

      - name: Verify deployed origin
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s" < ops/verify-origin.sh
